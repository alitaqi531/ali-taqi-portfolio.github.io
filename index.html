<html lang="en">
<head>

<title>Ali Taqi | eBay Specialist & Business Developer</title>

<style>
:root {
    --bg: #0b1020;
    --panel: #111a2e;
    --muted: #a8b3c9;
    --text: #f4f7ff;
    --accent: #76e4c2;
    --line: rgba(255,255,255,.11);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(ellipse at 80% 0%, #182d43 0, transparent 38%),
        var(--bg);
    color: var(--text);
    font: 16px/1.65 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}

a {
    color: inherit;

}

.wrap {
    width: min(1100px, 92%);
    margin: auto;
}

header {
    border-bottom: 1px solid var(--line);
}

.nav {

    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.brand {

    letter-spacing: .04em;
    font-size: 1.15rem;
}

.brand span {
    color: var(--accent);
}

.navlinks {
    display: flex;
    gap: 25px;
    color: var(--muted);
    font-size: .93rem;
}

.navlinks a:hover {
    color: var(--accent);
}

.menu-btn {

    background: transparent;

    padding: 8px 12px;
    border-radius: 8px;

.hero {

.eyebrow {

}

}

.hero h1 em {

}

.lead {
    max-width: 620px;
    color: var(--muted);

}

.actions {
    display: flex;

}

.btn {

    align-items: center;

    padding: 12px 18px;
    border-radius: 9px;
    font-weight: 750;
    border: 1px solid var(--line);
    transition: .2s;
}

.btn:hover {
    transform: translateY(-2px);
}

.btn.primary {
    background: var(--accent);
    color: #08201b;
    border-color: var(--accent);
}

.hero-card {

    background: linear-gradient(
        145deg,
        rgba(255,255,255,.07),

    );

    padding: 28px;

}

.monogram {
    height: 88px;
    width: 88px;
    border-radius: 22px;
    display: grid;
    place-items: center;
    background: var(--accent);

    font-size: 2rem;
    font-weight: 900;
    margin-bottom: 24px;
}

.hero-card h2 {
    font-size: 1.35rem;
    margin-bottom: 5px;
}

.hero-card p {

}

.mini {
    border-top: 1px solid var(--line);

    padding-top: 17px;

    justify-content: space-between;
    gap: 10px;
    font-size: .9rem;
}

.mini span:last-child {
    color: var(--accent);

}

}

    line-height: 1.15;
    margin-bottom: 13px;
}

.section-head p {
    color: var(--muted);
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 17px;
}

.card {
    padding: 24px;

    border-radius: 16px;
    background: rgba(255,255,255,.035);
    transition: transform .2s, background .2s;
}

.card:hover {
    transform: translateY(-4px);
    background: rgba(255,255,255,.06);
}

.num {
    color: var(--accent);

.card p {

.taglist {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 24px;
}

.tag {
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 99px;
    color: #dbe5f5;
    font-size: .9rem;
    background: #ffffff06;
}

.samples {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 17px;
}

.sample {

    flex-direction: column;
    justify-content: space-between;
    gap: 18px;
    background: linear-gradient(135deg, #15273a, #111827);
    border: 1px solid var(--line);
    border-radius: 17px;
    padding: 25px;
    min-width: 0;
}

.sample h3 {
    margin: 9px 0;
}

.sample p {
    color: var(--muted);
}

.sample-image {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: white;
}

.sample-note {
    font-size: .82rem;
    color: var(--muted);
}

.split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.info {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 25px;
    background: #ffffff04;
}

.info h3 {
    margin-bottom: 12px;
}

.info p,
.info li {
    color: var(--muted);
}

.info ul {
    padding-left: 20px;
}

.contact {
    border: 1px solid #76e4c24d;
    background: linear-gradient(120deg, #122c32, #111a2e);
    padding: 36px;
    border-radius: 22px;
    display: flex;
    justify-content: space-between;
    gap: 25px;
    align-items: center;
}

.contact h2 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    line-height: 1.15;
    margin-bottom: 10px;
}

.contact p {
    color: var(--muted);
    overflow-wrap: anywhere;
}

.contact a:hover {
    color: var(--accent);
}

    color: var(--muted);
